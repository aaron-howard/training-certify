name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  deployments: write
  id-token: write

# Required GitHub secrets for Vercel deploys:
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# Prefer linking the Vercel Git integration for automatic preview/production
# deploys; this workflow is for explicit staging (main) and production (manual).
# After deploy, run migrations against the target DB:
#   DATABASE_URL=... pnpm run db:migrate
# See docs/DEPLOYMENT.md (First Admin bootstrap + migrations).

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
        env:
          NODE_ENV: test

      - name: Build project
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Deploy to staging
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "::error::Missing VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID secrets."
            echo "Configure them in repo Settings → Secrets, or rely on Vercel Git integration and disable this job."
            exit 1
          fi
          pnpm exec vercel pull --yes --environment=preview --token "$VERCEL_TOKEN"
          pnpm exec vercel build --token "$VERCEL_TOKEN"
          DEPLOY_URL=$(pnpm exec vercel deploy --prebuilt --token "$VERCEL_TOKEN")
          echo "url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
          echo "Deployed staging: ${DEPLOY_URL}"
          echo "::notice::Run pnpm run db:migrate against the staging DATABASE_URL if schema changed. See docs/DEPLOYMENT.md go-live verify."

      - name: Post-deploy health smoke
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
          RETRIES: '8'
          RETRY_SLEEP: '10'
        run: |
          set -euo pipefail
          chmod +x scripts/check-uptime.sh
          ./scripts/check-uptime.sh

      - name: Install Playwright browsers (Chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: Post-deploy Playwright smoke
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.url }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          # Smoke + auth-redirect only; skip visual baselines on remote deploys
          pnpm exec playwright test e2e/smoke.spec.ts e2e/auth-redirect.spec.ts --project=chromium

      - name: Create deployment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'staging',
              auto_merge: false,
              required_contexts: []
            })

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'production'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
        env:
          NODE_ENV: test

      - name: Build project
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Deploy to production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "::error::Missing VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID secrets."
            exit 1
          fi
          pnpm exec vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          pnpm exec vercel build --prod --token "$VERCEL_TOKEN"
          DEPLOY_URL=$(pnpm exec vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
          echo "Deployed production: ${DEPLOY_URL}"
          echo "::notice::Run DATABASE_URL=\$PROD_URL pnpm run db:migrate, then bootstrap first Admin (docs/DEPLOYMENT.md go-live verify)."

      - name: Post-deploy health smoke
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
          RETRIES: '8'
          RETRY_SLEEP: '10'
        run: |
          set -euo pipefail
          chmod +x scripts/check-uptime.sh
          ./scripts/check-uptime.sh

      - name: Install Playwright browsers (Chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: Post-deploy Playwright smoke
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.url }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          # Smoke + auth-redirect only; skip visual baselines on remote deploys
          pnpm exec playwright test e2e/smoke.spec.ts e2e/auth-redirect.spec.ts --project=chromium

      - name: Create deployment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: []
            })
