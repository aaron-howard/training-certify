name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  deployments: write
  id-token: write # Required for OIDC authentication (if using AWS/GCP)

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to staging
        id: deploy
        run: |
          echo "Deploying to staging environment..."
          # Vercel deployment (if using Vercel)
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            npx vercel --token ${{ secrets.VERCEL_TOKEN }} --yes
            echo "url=$(npx vercel inspect --token ${{ secrets.VERCEL_TOKEN }} | grep -o 'https://[^ ]*' | head -1)" >> $GITHUB_OUTPUT
          else
            # Add other deployment commands here
            # Examples:
            # - Railway: railway up --environment staging
            # - AWS: aws s3 sync dist/ s3://your-bucket
            # - Custom: your-deployment-script.sh
            echo "url=https://staging.example.com" >> $GITHUB_OUTPUT
            echo "⚠️ NOTE: Configure VERCEL_TOKEN secret or update with your deployment commands"
          fi

      - name: Create deployment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'staging',
              auto_merge: false,
              required_contexts: []
            })

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # Production deployments require manual approval via workflow_dispatch
    # This prevents accidental production deployments
    if: github.event.inputs.environment == 'production'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to production
        id: deploy
        run: |
          echo "Deploying to production environment..."
          # Vercel production deployment (if using Vercel)
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
            echo "url=$(npx vercel inspect --token ${{ secrets.VERCEL_TOKEN }} --prod | grep -o 'https://[^ ]*' | head -1)" >> $GITHUB_OUTPUT
          else
            # Add other deployment commands here
            # Examples:
            # - Railway: railway up --environment production
            # - AWS: aws s3 sync dist/ s3://your-bucket
            # - Custom: your-deployment-script.sh
            echo "url=https://example.com" >> $GITHUB_OUTPUT
            echo "⚠️ NOTE: Configure VERCEL_TOKEN secret or update with your deployment commands"
          fi

      - name: Create deployment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: []
            })
