# Grouped minor/patch review habit: docs/dependency-minor-patch-workflow.md
version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    reviewers:
      - 'mraar'
    labels:
      - 'dependencies'
      - 'security'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    # Group updates to reduce PR noise
    groups:
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    # Major bumps: allow by default (typescript, zod, @types/*, prettier, etc.).
    # Ignore only packages where majors are usually breaking / need a dedicated upgrade branch.
    # Policy: docs/dependabot-majors.md — quarterly review: .github/workflows/dependency-major-review-reminder.yml
    ignore:
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@tanstack*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'drizzle-orm'
        update-types: ['version-update:semver-major']
      - dependency-name: 'drizzle-kit'
        update-types: ['version-update:semver-major']
      - dependency-name: 'nitro'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']
      - dependency-name: '@tailwindcss*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@clerk*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@sentry*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vercel'
        update-types: ['version-update:semver-major']
      - dependency-name: '@playwright*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'pg'
        update-types: ['version-update:semver-major']
      - dependency-name: 'lucide-react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'pino'
        update-types: ['version-update:semver-major']
      - dependency-name: 'pino-pretty'
        update-types: ['version-update:semver-major']
