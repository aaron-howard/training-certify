version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    reviewers:
      - 'mraar'
    labels:
      - 'dependencies'
      - 'security'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    # Group updates to reduce PR noise
    groups:
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    # Ignore major version updates (require manual review)
    ignore:
      # Major version updates should be reviewed manually
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
    # Security updates always allowed
    allow:
      - dependency-type: 'production'
        update-types:
          - 'security'
      - dependency-type: 'development'
        update-types:
          - 'security'
